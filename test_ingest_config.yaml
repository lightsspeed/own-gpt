ingestion:
  source_dir: test_ingest_src
  recursive: true
  supported_extensions:
  - .csv
  - .docx
  - .htm
  - .html
  - .pdf
  - .pptx
  - .xlsx
  chunking:
    chunk_size: 1000
    chunk_overlap: 200
  manifest:
    path: data/ingestion/manifest.json
  processing:
    batch_size: 10
    max_retries: 3
    retry_delay: 2.0
