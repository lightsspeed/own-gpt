version: '3.8'

services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - flashrank_cache:/app/.cache/flashrank
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/owngpt
      - REDIS_URL=redis://redis:6379/0
      - PG_HOST=db
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - ollama

  worker:
    build: .
    command: arq app.ingestion.jobs.WorkerSettings
    volumes:
      - .:/app
      - flashrank_cache:/app/.cache/flashrank
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/owngpt
      - REDIS_URL=redis://redis:6379/0
      - PG_HOST=db
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - ollama
    restart: unless-stopped

  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=owngpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No host port published: only the OwnGPT containers reach it on the
    # compose network at http://ollama:11434. Host-based dev overrides
    # OLLAMA_BASE_URL in .env (http://localhost:11434).
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  flashrank_cache:
