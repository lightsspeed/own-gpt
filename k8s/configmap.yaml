apiVersion: v1
kind: ConfigMap
metadata:
  name: owngpt-config
  namespace: owngpt
  labels:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "owngpt-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "owngpt"
  POSTGRES_USER: "postgres"
  REDIS_HOST: "owngpt-redis"
  REDIS_PORT: "6379"
  DATABASE_URL: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@owngpt-postgres:5432/owngpt"
  REDIS_URL: "redis://owngpt-redis:6379/0"
