apiVersion: v1
kind: Service
metadata:
  name: owngpt-frontend
  namespace: owngpt
  labels:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5173
      name: http
  selector:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owngpt-frontend
  namespace: owngpt
  labels:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: owngpt
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owngpt
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: owngpt-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: VITE_API_URL
              value: "http://owngpt-backend:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
