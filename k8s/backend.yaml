apiVersion: v1
kind: Service
metadata:
  name: owngpt-backend
  namespace: owngpt
  labels:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owngpt-backend
  namespace: owngpt
  labels:
    app.kubernetes.io/name: owngpt
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: owngpt
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owngpt
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: owngpt-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: owngpt-config
            - secretRef:
                name: owngpt-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@owngpt-postgres:5432/owngpt"
            - name: REDIS_URL
              value: "redis://owngpt-redis:6379/0"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
