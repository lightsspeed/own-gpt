name: RAG Benchmark

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 2 * * *"  # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      retriever:
        description: "Retriever mode"
        default: "hybrid"
        type: choice
        options:
          - hybrid
          - vector
          - bm25
      dataset:
        description: "Dataset name"
        default: "thinking_fast_and_slow"
        type: string
      compare:
        description: "Compare against (latest or run ref)"
        default: "latest"
        type: string

env:
  PYTHON_VERSION: "3.11"
  DATASET: ${{ inputs.dataset || 'thinking_fast_and_slow' }}
  RETRIEVER: ${{ inputs.retriever || 'hybrid' }}
  COMPARE: ${{ inputs.compare || 'latest' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owngpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verify install reproducibility
        run: |
          python scripts/verify_install.py

      - name: Install dependencies (lockfile first, then ragas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install ragas  # Optional: RAGAS scoring
          pip list 2>&1 | head -20

      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
          echo "LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/owngpt" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env

      - name: Wait for PostgreSQL & Redis
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 5432 && nc -z localhost 6379; then
              echo "Postgres and Redis are ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
            echo "Backend failed to start. Logs:"
            cat uvicorn.log
            exit 1
          fi

      - name: Rebuild search index
        run: |
          python -m app.evaluation.cli index rebuild --base-url http://localhost:8000 || true

      - name: Run benchmark
        id: benchmark
        run: |
          python -m app.evaluation.cli benchmark \
            ${{ env.DATASET }} \
            --retriever ${{ env.RETRIEVER }} \
            --compare ${{ env.COMPARE }} \
            --workers 3 \
            --ci \
            --pr-summary \
            > benchmark_result.json 2>&1 || true

          echo "Benchmark output:"
          cat benchmark_result.json

          # Extract gate status from JSON output
          GATE_STATUS=$(python -c "
import json
try:
    with open('benchmark_result.json') as f:
        data = json.load(f)
    print(data.get('gates', 'unknown'))
except Exception:
    print('parse_error')
" 2>/dev/null || echo "parse_error")

          echo "GATE_STATUS=$GATE_STATUS" >> $GITHUB_ENV

      - name: Extract report and PR summary
        id: pr_summary
        run: |
          python -c "
import json
try:
    with open('benchmark_result.json') as f:
        data = json.load(f)
    summary = data.get('pr_summary', 'No summary available')
    with open('pr_summary.md', 'w') as out:
        out.write(summary)
except Exception:
    with open('pr_summary.md', 'w') as out:
        out.write('No summary available')
"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ env.DATASET }}-${{ env.RETRIEVER }}-${{ github.sha }}
          path: |
            benchmark_result.json
            pr_summary.md
            uvicorn.log
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_summary.md')) {
              const summary = fs.readFileSync('pr_summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

      - name: Check gate status
        id: gate_check
        run: |
          echo "Gate status: ${{ env.GATE_STATUS }}"
          if [ "${{ env.GATE_STATUS }}" = "fail" ]; then
            echo "❌ Regression gates FAILED — merge blocked"
            exit 1
          elif [ "${{ env.GATE_STATUS }}" = "warning" ]; then
            echo "⚠️  Regression gates PASSED with warnings"
            exit 0
          else
            echo "✅ Regression gates PASSED"
            exit 0
          fi

      - name: Stop backend
        if: always()
        run: |
          if [ -n "${{ env.APP_PID }}" ]; then
            kill ${{ env.APP_PID }} 2>/dev/null || true
          fi

  benchmark-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owngpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        retriever: [vector, bm25, hybrid]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verify install reproducibility
        run: |
          python scripts/verify_install.py

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt

      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
          echo "LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/owngpt" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Run benchmark
        run: |
          python -m app.evaluation.cli benchmark \
            ${{ env.DATASET }} \
            --retriever ${{ matrix.retriever }} \
            --ci \
            > benchmark_matrix_${{ matrix.retriever }}.json 2>&1 || true

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ env.DATASET }}-${{ matrix.retriever }}-${{ github.sha }}
          path: benchmark_matrix_${{ matrix.retriever }}.json
          retention-days: 30

      - name: Stop backend
        if: always()
        run: |
          if [ -n "${{ env.APP_PID }}" ]; then
            kill ${{ env.APP_PID }} 2>/dev/null || true
          fi

